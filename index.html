        function generateCopy() {
            const product = document.getElementById('product').value;
            const templateList = templates[product].comprehensive;
            const randomIndex = Math.floor(Math.random() * templateList.length);
            const selectedTemplate = templateList[randomIndex];
            document.getElementById('result-title').textContent = selectedTemplate.title;
            document.getElementById('result-text').textContent = selectedTemplate.content;
        }
        
        function copyText() {
            const title = document.getElementById('result-title').textContent;
            const content = document.getElementById('result-text').textContent;
            const fullText = title + '\n\n' + content;
            if (fullText) {
                copyToClipboard(fullText);
            }
        }
        
        function copyTitle() {
            const title = document.getElementById('result-title').textContent;
            if (title) {
                copyToClipboard(title);
            }
        }
        
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopyMessage();
                }).catch(err => {
                    fallbackCopyTextToClipboard(text);
                });
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }
        
        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showCopyMessage();
                }
            } catch (err) {
                console.error('复制失败:', err);
            }
            
            document.body.removeChild(textArea);
        }
        
        function showCopyMessage() {
            const message = document.getElementById('copy-message');
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 2000);
        }
        
        window.onload = function() {
            generateCopy();
        };
    </script>
